name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name InstaIndir windows/insta_indir.py
      - uses: actions/upload-artifact@v4
        with:
          name: InstaIndir-windows
          path: dist/InstaIndir.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InstaIndir.exe
